name: Enterprise KYC CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Rahul123
          POSTGRES_DB: enterprise_kyc_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:

        image: redis:7

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"

      - name: Install dependencies

        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run Ruff

        run: |
          ruff check src
          ruff format src --check

      - name: Run Alembic migrations

        env:
          APP_NAME: Enterprise KYC Platform
          ENV: test
          DEBUG: true
          DATABASE_HOST: localhost
          DATABASE_URL: postgresql+asyncpg://postgres:Rahul123localhost:5432/enterprise_kyc_test
          SYNC_DATABASE_URL: postgresql://postgres:Rahul123localhost:5432/enterprise_kyc_test

          JWT_SECRET_KEY: 5e67125afd3dc01f42a6ac7a7dfe544a0eb40799e544562963271e1c52ad9a8d
          JWT_ALGORIGHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 15

          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0

          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: redis://localhost:6379/0

        run: |
          alembic upgrade head

      - name: Run tests

        env:
          PYTHONPATH: .

          APP_NAME: Enterprise KYC Platform
          ENV: test
          DEBUG: true
          DATABASE_HOST: localhost
          DATABASE_URL: postgresql+asyncpg://postgres:Rahul123localhost:5432/enterprise_kyc_test
          SYNC_DATABASE_URL: postgresql://postgres:Rahul123localhost:5432/enterprise_kyc_test

          JWT_SECRET_KEY: 5e67125afd3dc01f42a6ac7a7dfe544a0eb40799e544562963271e1c52ad9a8d
          JWT_ALGORIGHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 15

          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0

          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: redis://localhost:6379/0

        run: |
          pytest 